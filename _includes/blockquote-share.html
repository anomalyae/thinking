<script>
document.addEventListener('DOMContentLoaded', function() {
  const blockquotes = document.querySelectorAll('blockquote');
  
  blockquotes.forEach(function(quote) {
    const shareContainer = document.createElement('div');
    shareContainer.className = 'quote-share-container';
    
    shareContainer.innerHTML = `
      <button class="quote-share-btn twitter" aria-label="Share on Twitter">
        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 4s-.7 2.1-2 3.4c1.6 10-9.4 17.3-18 11.6 2.2.1 4.4-.6 6-2C3 15.5.5 9.6 3 5c2.2 2.6 5.6 4.1 9 4-.9-4.2 4-6.6 7-3.8 1.1 0 3-1.2 3-1.2z"></path></svg>
      </button>
      <button class="quote-share-btn linkedin" aria-label="Share on LinkedIn">
        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M16 8a6 6 0 0 1 6 6v7h-4v-7a2 2 0 0 0-2-2 2 2 0 0 0-2 2v7h-4v-7a6 6 0 0 1 6-6z"></path><rect x="2" y="9" width="4" height="12"></rect><circle cx="4" cy="4" r="2"></circle></svg>
      </button>
      <button class="quote-share-btn copy" aria-label="Copy Quote">
        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2"></path><rect x="8" y="2" width="8" height="4" rx="1" ry="1"></rect></svg>
      </button>
    `;
    

    quote.parentNode.insertBefore(shareContainer, quote.nextSibling);
    

    const quoteRect = quote.getBoundingClientRect();
    shareContainer.style.top = `${quote.offsetTop}px`;
  });
  

  document.querySelectorAll('.quote-share-btn').forEach(function(button) {
    button.addEventListener('click', function() {
      const quote = this.closest('.quote-share-container').previousElementSibling;
      const quoteText = quote.textContent.trim();
      const pageTitle = document.title;
      const pageUrl = window.location.href;
      
      if (this.classList.contains('twitter')) {
        window.open(`https://twitter.com/intent/tweet?text="${encodeURIComponent(quoteText)}"&url=${encodeURIComponent(pageUrl)}`, '_blank');
      } else if (this.classList.contains('linkedin')) {
        window.open(`https://www.linkedin.com/sharing/share-offsite/?url=${encodeURIComponent(pageUrl)}`, '_blank');
      } else if (this.classList.contains('copy')) {
        navigator.clipboard.writeText(`"${quoteText}" — from ${pageTitle} ${pageUrl}`).then(() => {
          // Show copied notification
          const notification = document.createElement('div');
          notification.className = 'copy-notification';
          notification.textContent = 'Quote copied!';
          document.body.appendChild(notification);
          
          setTimeout(() => {
            notification.remove();
          }, 2000);
        });
      }
    });
  });
});
</script>

<style>
blockquote {
  position: relative;
  margin: 1.5rem 0;
  padding: 1rem 2rem;
  border-left: 2px solid #89c2d9;
  background-color: #EFF1F3;
}

.quote-share-container {
  display: flex;
  justify-content: flex-end;
  margin-top: -0.5rem;
  margin-bottom: 1.5rem;
  gap: 0.5rem;
}

.quote-share-btn {
  display: flex;
  align-items: center;
  justify-content: center;
  width: 32px;
  height: 32px;
  border-radius: 50%;
  border: none;
  background-color: #f0f0f0;
  cursor: pointer;
  transition: background-color 0.2s;
}

.quote-share-btn:hover {
  background-color: #e0e0e0;
}

.quote-share-btn.twitter:hover {
  background-color: #1DA1F2;
  color: white;
}

.quote-share-btn.linkedin:hover {
  background-color: #0077B5;
  color: white;
}

.quote-share-btn.copy:hover {
  background-color: #28a745;
  color: white;
}

.copy-notification {
  position: fixed;
  bottom: 20px;
  left: 50%;
  transform: translateX(-50%);
  background-color: #333;
  color: white;
  padding: 8px 16px;
  border-radius: 4px;
  z-index: 1000;
  animation: fadeOut 2s forwards;
}

@keyframes fadeOut {
  0% { opacity: 1; }
  70% { opacity: 1; }
  100% { opacity: 0; }
}
</style>
