# Site
name: "Anomaly LLC-FZ"
title: "Clarity"
description: "Writings from our perspective at Anomaly"
logo: 'assets/images/glitch.png'
favicon: 'assets/images/glitch.png'
url: "https://thinking.anomaly.ae"
baseurl: ""
asset_version: "20260308c"
# Analytics
# google_analytics: '' # Not using GA
mixpanel_token: '4bf983e3bdd2697d020a29c56a2d913b'
include: ["_pages"]
permalink: /:title/
email: development@anomaly.ae

# Authors
authors:
  anomaly:
    name: "Anomaly LLC-FZ"
    display_name: "Anomaly"
    avatar: 'assets/images/glitch.png'  # use your logo
    email: development@anomaly.ae
    web: https://anomaly.ae
    description: "Abstract thinking at Anomaly. Exploring non-linear pathways in technology and innovation."
    
# Plugins
plugins:
  - jekyll-paginate
  - jekyll-sitemap
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-archives
  - jekyll-figure
    
# Archives
jekyll-archives:
  enabled:
    - categories
  layout: archive
  permalinks:
    category: '/category/:name/'
    
# Pagination 
paginate: 6
paginate_path: /page:num/
force_polling: true
    
# Other
highlighter: none
markdown: kramdown
kramdown:
   syntax_highlighter_opts:
      disable : true


# Lazy Images ("enabled" or "disabled")
lazyimages: "disabled"

# Post Author Box ("enabled" or "disabled")
authorbox: "disabled"

# Sass
sass:
  sass_dir: _sass
  style: compressed

exclude: [changelog.md, LICENSE.txt, README.md, Gemfile, Gemfile.lock]
