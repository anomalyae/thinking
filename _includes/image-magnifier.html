<script>
document.addEventListener('DOMContentLoaded', function() {
  // Select images with a specific class
  const magnifiableImages = document.querySelectorAll('img.magnifiable');
  
  magnifiableImages.forEach(function(img) {
    // Create wrapper container
    const wrapper = document.createElement('div');
    wrapper.className = 'image-magnifier-container';
    
    // Create zoom button - now always visible
    const zoomButton = document.createElement('button');
    zoomButton.className = 'image-zoom-btn';
    zoomButton.innerHTML = `
      <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="11" cy="11" r="8"></circle>
        <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
        <line x1="11" y1="8" x2="11" y2="14"></line>
        <line x1="8" y1="11" x2="14" y2="11"></line>
      </svg>
    `;
    
    // Add click event to button
    zoomButton.addEventListener('click', function() {
      createLightbox(img.src, img.alt);
    });
    
    img.parentNode.insertBefore(wrapper, img);
    wrapper.appendChild(img);
    wrapper.appendChild(zoomButton);
  });
  
  // Function to create lightbox
  function createLightbox(src, alt) {
    const lightbox = document.createElement('div');
    lightbox.className = 'image-lightbox';
    
    lightbox.innerHTML = `
      <div class="lightbox-content">
        <button class="lightbox-close">&times;</button>
        <img src="${src}" alt="${alt || 'Image'}">
        <div class="lightbox-caption">${alt || ''}</div>
      </div>
    `;
    
    // Close button functionality
    lightbox.querySelector('.lightbox-close').addEventListener('click', function() {
      document.body.removeChild(lightbox);
    });
    
    // Close on background click
    lightbox.addEventListener('click', function(e) {
      if (e.target === lightbox) {
        document.body.removeChild(lightbox);
      }
    });
    
    // Close on ESC key
    document.addEventListener('keydown', function(e) {
      if (e.key === 'Escape' && document.querySelector('.image-lightbox')) {
        document.body.removeChild(lightbox);
      }
    }, { once: true });
    
    document.body.appendChild(lightbox);
  }
});
</script>

<style>
.image-magnifier-container {
  position: relative;
  display: inline-block;
  max-width: 100%;
}

.image-zoom-btn {
  position: absolute;
  bottom: 10px;
  right: 10px;
  background-color: #BCA060;
  color: white;
  border: none;
  border-radius: 50%;
  width: 36px;
  height: 36px;
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  /* Removed opacity: 0 and transition to make it always visible */
}

/* Removed hover state for the zoom button */
/* .image-magnifier-container:hover .image-zoom-btn {
  opacity: 1;
} */

.image-lightbox {
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  background-color: rgba(0, 0, 0, 0.9);
  z-index: 1000;
  display: flex;
  align-items: center;
  justify-content: center;
}

.lightbox-content {
  position: relative;
  max-width: 90%;
  max-height: 90%;
}

.lightbox-content img {
  max-width: 100%;
  max-height: 90vh;
  object-fit: contain;
}

.lightbox-close {
  position: absolute;
  top: -40px;
  right: 0;
  color: white;
  background: transparent;
  border: none;
  font-size: 30px;
  cursor: pointer;
}

.lightbox-caption {
  color: white;
  text-align: center;

}
</style>
